# @package _global_

# v3map benchmark: v2 + the egocentric top-down conflict map sensor (route 3 /
# S7-lite). v2 is untouched; this pair only ADDS the map observation.
defaults:
  - hssd_spot_human_social_nav_twoagent_v2
  - /habitat/task/lab_sensors@habitat.task.lab_sensors.topdown_conflict_map: topdown_conflict_map
  - _self_

habitat:
  gym:
    obs_keys:
      - agent_0_spot_head_stereo_depth_sensor
      - agent_0_humanoid_detector_sensor
      - agent_0_localization_sensor
      - agent_0_other_agent_gps
      - agent_0_other_agent_heading
      - agent_0_social_nav_policy_state
      - agent_0_goal_world_delta
      - agent_0_goal_waypoint_delta
      - agent_0_backoff_waypoint_delta
      - agent_0_trajectory_buffer
      - agent_0_has_finished_oracle_nav
      - agent_1_has_finished_oracle_nav
      - agent_0_goal_to_agent_gps_compass
      - agent_0_lidar_scan
      - agent_0_topdown_conflict_map
