# @package _global_

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: task_config_base
  # Config agent sensors
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.agent_0: spot_agent
  - /habitat/simulator/agents@habitat.simulator.agents.agent_0: spot
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.agent_1: rgbd_head_agent
  - /habitat/simulator/agents@habitat.simulator.agents.agent_1: human
  # Config agent hssd data
  - /habitat/dataset/rearrangement: hssd
  
  # Ensure agent_1 has an arm action available so ResetArmSkill can be used.
  - /habitat/task/actions@habitat.task.actions.agent_1_arm_action: arm_action
  # Config agent action
  - /habitat/task/actions@habitat.task.actions.agent_0_base_velocity: base_velocity_non_cylinder
  - /habitat/task/actions@habitat.task.actions.agent_1_base_velocity: base_velocity
  - /habitat/task/actions@habitat.task.actions.agent_1_rearrange_stop: rearrange_stop
  - /habitat/task/actions@habitat.task.actions.agent_0_rearrange_stop: rearrange_stop
  - /habitat/task/actions@habitat.task.actions.agent_0_oracle_nav_action: oracle_nav_action
  - /habitat/task/actions@habitat.task.actions.agent_1_oracle_nav_action: oracle_nav_action
  # Config agent sensor
  - /habitat/task/measurements:
    - articulated_agent_force
    - articulated_agent_colls
    - num_steps
    - did_agents_collide
    # - num_agents_collide
    - force_terminate
    - social_nav_reward
    # - rot_dist_to_goal
    # - dist_to_goal
    # - nav_to_pos_succ
    - social_dist_to_goal
    # - social_nav_seek_success
    - social_nav_stats
    - social_nav_to_pos_succ
    
  - /habitat/task/lab_sensors:
    - relative_resting_pos_sensor
    - localization_sensor
    - other_agent_gps
    - other_agent_heading
    - social_nav_policy_state
    - goal_world_delta
    - goal_waypoint_delta
    - backoff_waypoint_delta
    - trajectory_buffer
    - humanoid_detector_sensor
    - has_finished_oracle_nav
  - /habitat/task/lab_sensors@habitat.task.lab_sensors.agent_0_goal_to_agent_gps_compass: nav_goal_sensor
  - /habitat/task/lab_sensors@habitat.task.lab_sensors.agent_0_spot_head_stereo_depth_sensor: spot_head_stereo_depth_sensor
  - /habitat/task/lab_sensors@habitat.task.lab_sensors.agent_1_agents_within_threshold: agents_within_threshold
  - _self_

# This yaml is a variant of the Spot-human social-nav benchmark focused on two-agent
# social navigation only (collision avoidance and reaching a navigation goal).
# Objects and object-manipulation observations are removed.

habitat:
  task:
    lab_sensors:
      agent_1_agents_within_threshold:
        x_len: 2.0
        y_len: 1.5
        agent_idx: 1
      agent_0_goal_to_agent_gps_compass:
        goal_is_human: False
      # Define the human detector
      humanoid_detector_sensor:
        # If the human detector function is image or binary flag
        return_image: False
        is_return_image_bbox: False
       

    # Use the new minimal TwoAgentSocialNavTask that doesn't bind PDDL/problems
    type: TwoAgentSocialNavTask-v0
    min_start_distance: 0.0
    # ORCA: the TASK drives only the human (agent_1); the robot (agent_0) is
    # driven by its skills (geodesic go-to-goal / reverse backoff) outputting
    # base_velocity, with NO human avoidance of its own. The robot stays
    # registered in the task ORCA sim as a neighbour the human avoids.
    # No static polys; walls via step_filter.
    rvo_use_orca_nav: True
    rvo_static_map_enabled: False
    rvo_controlled_agents: [1]
    rvo_map_resolution: 512
    # Human ORCA speed cap. Default (default_structured_configs) is 0.1 m/s, which
    # equals agent_1_oracle_nav_action.dist_thresh (0.1) with a 1 s waypoint
    # lookahead -> any ORCA slow-down drops the waypoint below dist_thresh and the
    # human freezes (calculate_stop_pose), and even when moving 0.1 m/s is ~1/13
    # of a normal walk. Lifted from 0.1 so the human walks toward its goal at a
    # reasonable pace while still using RVO to avoid the robot. Tune as needed.
    rvo_agent_1_max_speed: 0.8
    # Inflate the robot's radius (vs the shared rvo_agent_radius=0.2) ONLY inside
    # the human's task ORCA. ORCA splits avoidance 50/50, but the robot is driven
    # by its own skill (often standing/spinning) and does not reciprocate, so the
    # human under-avoids and clips it -> DidAgentsCollide ends the episode early.
    # A bigger safety disc makes the human keep more clearance. Tune as needed.
    rvo_agent_0_radius: 0.5
    reward_measure: social_nav_reward
    success_measure: social_nav_to_pos_success
    success_reward: 10.0
    slack_reward: -0.1
    end_on_success: True
    task_spec_base_path: benchmark/multi_agent/
    task_spec: pddl/multi_agent_social_nav_twoagent_minimal
    pddl_domain_def: fp
    constraint_violation_ends_episode: False
    constraint_violation_drops_object: False

    measurements:
      force_terminate:
        max_accum_force: -1
        max_instant_force: -1
      social_nav_reward:
        count_coll_pen: 0.01
        max_count_colls: -1
        count_coll_end_pen: 5.0
        # Robot-human distance (m) below which the reward penalizes proximity
        # and pays for opening distance -- the gradient that teaches the HL
        # planner to yield at doorway range (at 0.2 there was no signal).
        safe_dis_min: 1.5
      # Robot body radius is 0.4 m, so a center-to-goal threshold below that is
      # geometrically unreachable near walls. Success band = robot radius.
      social_nav_to_pos_succ:
        success_distance: 0.4

    actions:
      # agent_0_base_velocity:
      #   lin_speed: 40.0
      #   allow_dyn_slide: True
      #   collision_threshold: 1e-5
      #   navmesh_offset: [[0.0, 0.0], [0.225, 0.0]]
      #   enable_lateral_move: False
      #   longitudinal_lin_speed: 10.0
      #   lateral_lin_speed: 5.0
      #   ang_speed: 10.0
      #   enable_rotation_check_for_dyn_slide: False

      agent_0_oracle_nav_action:
        # RVO-driven waypoint follower: TwoAgentSocialNavTask solves ORCA each
        # step and injects a 1 s-ahead waypoint (base_pos + orca_vel*1.0) into
        # oracle_nav_action; OracleNavWaypointAction turns toward it then walks
        # at the ORCA-solved speed (step_filter handles walls).
        type: OracleNavWaypointAction
        motion_control: base_velocity
        # -1.0 snaps to navmesh closest point to goal (avoids "at goal" on step 0 when robot starts near goal)
        spawn_max_dist_to_obj: -1.0
        # dist_thresh doubles as the stop gate: halt when ORCA speed < 0.1 m/s.
        dist_thresh: 0.1
        lin_speed: 8.0
        ang_speed: 8.0


      agent_1_oracle_nav_action:
        type: OracleNavWaypointAction
        motion_control: human_joints
        # Snap to closest navmesh point (deterministic, not random sample within radius)
        spawn_max_dist_to_obj: -1.0
        dist_thresh: 0.1
        lin_speed: 6.0
        ang_speed: 6.0

      # Arm action for agent_1 (humanoid) so ResetArmSkill has an arm_action
      agent_1_arm_action:
        grip_controller: MagicGraspAction

    robot_at_thresh: 3.0

  gym:
    # Remove object-related keys so the policy only receives social-nav observations.
    # The agent_0_* sensors feed the HRL skills (the agent_0_ prefix is stripped
    # before reaching agent_0's policy).
    obs_keys:
      - agent_0_spot_head_stereo_depth_sensor
      - agent_0_humanoid_detector_sensor
      - agent_0_localization_sensor
      - agent_0_other_agent_gps
      - agent_0_other_agent_heading
      - agent_0_social_nav_policy_state
      - agent_0_goal_world_delta
      - agent_0_goal_waypoint_delta
      - agent_0_backoff_waypoint_delta
      - agent_0_trajectory_buffer
      - agent_0_has_finished_oracle_nav
      - agent_1_has_finished_oracle_nav
      - agent_0_goal_to_agent_gps_compass


  environment:
    max_episode_steps: 750

  simulator:
    type: RearrangeSim-v0
    seed: 100
    additional_object_paths:
      - "data/objects/ycb/configs/"
      - "data/objects/amazon_berkeley/configs/"
      - "data/objects/google_object_dataset/configs/"
    concur_render: True
    auto_sleep: True
    agents_order:
      - agent_0
      - agent_1
    agents:
      agent_0:
        joint_start_noise: 0.0
    kinematic_mode: True
    ac_freq_ratio: 1
    step_physics: False

    habitat_sim_v0:
      allow_sliding: True
      enable_physics: True

  dataset:
    data_path: /habitat-lab/data/social_nav_episode_0415_570.json.gz
