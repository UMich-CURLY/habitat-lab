# @package _global_

defaults:
  - /habitat_baselines: habitat_baselines_il_config_base
  - /benchmark/nav/objectnav: objectnav_mp3d
  # - /habitat_baselines/rl/policy/obs_transforms@habitat_baselines.rl.policy.main_agent.obs_transforms.resize_shortest_edge: resize_shortest_edge_base
  # - /habitat_baselines/rl/policy/obs_transforms@habitat_baselines.rl.policy.main_agent.obs_transforms.center_cropper: center_cropper_base
  - _self_

habitat:
  environment:
    iterator_options:
      max_scene_repeat_steps: -1
  task:
    success_reward: 2.5
    slack_reward: -1e-3
    measurements:
      success:
        type: Success
      spl:
        type: SPL
  dataset:
    split: train

habitat_baselines:
  trainer_name: il-trainer
  torch_gpu_id: 0
  tensorboard_dir: "tb/objectnav/overfitting/rgbd/seed_1/"
  video_dir: "video_dir/objectnav/overfitting/rgbd/seed_1/"
  test_episode_count: 10
  eval_ckpt_path_dir: "data/new_checkpoints/objectnav/objectnav_env_v4/rgbd/seed_1_70M/ckpt.22.pth"
  num_environments: 1
  checkpoint_folder: "data/new_checkpoints/objectnav/overfitting/rgbd/seed_1"
  log_interval: 10
  num_updates: 1000
  num_checkpoints: 10

  il:
    policy:
      main_agent: 
        name: ObjectNavILPolicy
    use_iw: True
    distrib_backend: GLOO
    BehaviorCloning:
      lr: 0.001
      eps: 1.0e-5
      clip_param: 0.2
      num_mini_batch: 1
      max_grad_norm: 0.2
      num_steps: 16
      use_linear_clip_decay: False
      use_linear_lr_decay: True
      reward_window_size: 50
      hidden_size: 512
      sync_frac: 0.6
      log_file: "data/objectnav/logs/bc_train.log"

    rl:
      success_reward: 2.5
      slack_reward: -1e-3

    model:
      ablate_depth: False
      ablate_rgb: False
      num_recurrent_layers: 2
      rnn_type: "GRU"
      backbone: "resnet18"
      resnet_baseplanes: 32
      normalize_visual_inputs: False
      force_blind_policy: False
      embed_sge: True
      embed_goal_seg: False
      sem_seg_pred: True
      no_vision: False
      USE_SEMANTICS: False
      use_pred_semantics: True
      switch_to_pred_semantics_update: 0

      semantic_encoder:
        rednet_ckpt: "data/rednet-models/rednet_semmap_mp3d_tuned.pth"
        cnn_type: "ResnetSemSegEncoder"
        output_size: 256
        backbone: "resnet18"
        train_encoder: True
        embedding_size: 4
        is_thda: False
        num_classes: 29

      RGB_ENCODER:
        cnn_type: "ResnetRGBEncoder"
        output_size: 256
        backbone: "resnet18"
        train_encoder: True

      DEPTH_ENCODER:
        cnn_type: "VlnResnetDepthEncoder"
        output_size: 128
        backbone: "resnet50"
        trainable: False
        ddppo_checkpoint: "data/ddppo-models/gibson-2plus-resnet50.pth"

      STATE_ENCODER:
        hidden_size: 2048
        rnn_type: "GRU"
        num_recurrent_layers: 2

      SEQ2SEQ:
        use_prev_action: True

      progress_monitor:
        use: False
  eval:
    split: "train"

  
