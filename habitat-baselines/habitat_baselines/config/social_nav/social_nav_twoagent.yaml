# Two-agent social navigation baseline config
# This file mirrors `social_nav.yaml` but switches the benchmark default
# to use the custom `hssd_spot_human_social_nav_twoagent` task config in
# `habitat/config/benchmark/multi_agent/` so it can be launched via
# `python -u -m habitat_baselines.run --config-name social_nav/social_nav_twoagent`.

defaults:
  - /benchmark/multi_agent: hssd_spot_human_social_nav_twoagent
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /habitat/simulator/sim_sensors@habitat_baselines.eval.extra_sim_sensors.third_rgb_sensor: third_rgb_sensor
  - /habitat_baselines/rl/policy/obs_transforms@habitat_baselines.rl.policy.agent_0.obs_transforms.add_virtual_keys:
    - add_virtual_keys_base
  - /habitat_baselines/rl/policy/obs_transforms@habitat_baselines.rl.policy.agent_1.obs_transforms.add_virtual_keys:
    - add_virtual_keys_base
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_0: monolithic
  - /habitat_baselines/rl/policy@habitat_baselines.rl.policy.agent_1: hl_fixed
  - /habitat_baselines/rl/policy/hierarchical_policy/defined_skills@habitat_baselines.rl.policy.agent_1.hierarchical_policy.defined_skills: oracle_skills_human_multi_agent
  # Ensure the task composes the special pddl_apply_action so skills can
  # write postconditions into the action vector. This maps the structured
  # node into the task actions for each agent.
  - /habitat/task/actions@habitat.task.actions.agent_0_pddl_apply_action: pddl_apply_action
  - /habitat/task/actions@habitat.task.actions.agent_1_pddl_apply_action: pddl_apply_action
  # Ensure the oracle navigation action is available for both agents.
  # - /habitat/task/actions@habitat.task.actions.agent_0_oracle_nav_action: oracle_nav_action
  # - /habitat/task/actions@habitat.task.actions.agent_1_oracle_nav_action: oracle_nav_action
  - _self_

hydra:
  job:
    name: 'social_nav_twoagent'

habitat_baselines:
  verbose: False
  trainer_name: "ddppo"
  updater_name: "HRLPPO"
  distrib_updater_name: "HRLDDPPO"
  torch_gpu_id: 0
  video_fps: 30
  eval_ckpt_path_dir: "data/checkpoints/latest.pth"
  num_environments: 1
  num_updates: 0
  total_num_steps: -1
  log_interval: 10
  num_checkpoints: 1
  force_torch_single_threaded: True
  eval_keys_to_include_in_name: ['pddl_success']
  load_resume_state_config: False
  rollout_storage_name: "HrlRolloutStorage"

  evaluate: False

  eval:
    extra_sim_sensors:
      third_rgb_sensor:
        height: 224
        width: 171

    should_load_ckpt: True
    video_option: ["tensorboard", "disk"]

  rl:
    agent:
      type: "MultiAgentAccessMgr"
      num_agent_types: 2
      num_active_agents_per_type: [1, 1]
      num_pool_agents_per_type: [1, 1]
      agent_sample_interval: 20
      force_partner_sample_idx: -1
    policy:
      # Modify the action distribution
      agent_0:
        name: "PointNavResNetPolicy"
        action_distribution_type: "gaussian"
        action_dist:
          use_log_std: True
          clamp_std: True
          std_init: -1.0
          use_std_param: True
      agent_1:
        hierarchical_policy:
          high_level_policy:
            add_arm_rest: False
            policy_input_keys:
              - "head_depth"
              - "other_agent_gps"
            allowed_actions:
              - nav_to_goal
          # Override to use the oracle navigation skill (which will actually execute navigation).
          defined_skills:
            nav_to_randcoord:
              skill_name: "OracleNavPolicy"
              max_skill_steps: 1500
              ignore_grip: True
            nav_to_goal:
              skill_name: "OracleNavPolicy"
              pddl_action_names: ["nav_to_goal", "nav_to_obj"]
              action_name: "agent_1_oracle_nav_action"
              max_skill_steps: 1500
              ignore_grip: True
            back_off:
              skill_name: "BackOffSkillPolicy"
              pddl_action_names: ["back_off"]
              max_skill_steps: 20
              ignore_grip: True
            wait:
              skill_name: "WaitSkillPolicy"
              pddl_action_names: ["wait"]
              max_skill_steps: -1
              force_end_on_timeout: False
    ppo:
      # ppo params
      clip_param: 0.2
      ppo_epoch: 1
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.0001
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.2
      num_steps: 128
      use_gae: True
      gamma: 0.99
      tau: 0.95

    ddppo:
      sync_frac: 0.6
      # The PyTorch distributed backend to use
      distrib_backend: NCCL
      # Visual encoder backbone
      pretrained_weights: data/ddppo-models/gibson-2plus-resnet50.pth
      # Initialize with pretrained weights
      pretrained: False
      # Initialize just the visual encoder backbone with pretrained weights
      pretrained_encoder: False
      # Whether the visual encoder backbone will be trained.
      train_encoder: True
      # Whether to reset the critic linear layer
      reset_critic: False
      # Model parameters
      backbone: resnet18
      rnn_type: LSTM
      num_recurrent_layers: 2
