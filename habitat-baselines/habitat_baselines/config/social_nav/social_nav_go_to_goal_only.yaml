# @package _global_

# Extend the skill test config but keep robot on GoToGoalSkill only
# Human agent uses only wait skill (stays stationary)
defaults:
  - social_nav_skill_test
  - _self_

habitat:
  environment:
    max_episode_steps: 500  # Longer episodes for pure goal nav

habitat_baselines:
  rl:
    policy:
      agent_0:
        hierarchical_policy:
          high_level_policy:
            backoff_switch_step: 10000  # Very high so policy never switches to backoff
      agent_1:
        hierarchical_policy:
          high_level_policy:
            name: "FixedHighLevelPolicy"
            allow_other_place: False
            add_arm_rest: False
          ignore_skills: ["nav_to_obj", "nav_to_goal", "nav_to_goal_social", "nav_to_randcoord"]
