# @package _global_

# HRL social-nav config where agent_0's GoToGoalSkill drives the robot with a
# self-contained RVO/ORCA collision-avoidance behaviour (outputs base_velocity),
# while the task drives the human (agent_1) with its own RVO. CyclingHighLevelPolicy
# selects go_to_goal by default and switches to backoff when the human is detected.

defaults:
  - /benchmark/multi_agent: hssd_spot_human_social_nav_twoagent
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /habitat/simulator/sim_sensors@habitat_baselines.eval.extra_sim_sensors.third_rgb_sensor: third_rgb_sensor
  - /habitat_baselines/rl/policy/obs_transforms@habitat_baselines.rl.policy.agent_0.obs_transforms.add_virtual_keys:
    - add_virtual_keys_base
  - /habitat_baselines/rl/policy/obs_transforms@habitat_baselines.rl.policy.agent_1.obs_transforms.add_virtual_keys:
    - add_virtual_keys_base
  - _self_

habitat:
  task:
    type: TwoAgentSocialNavTask-v0
    # Human (agent_1) FixedHighLevelPolicy plan that only references skills the
    # human has (the shared *_minimal solution contains back_off, which crashes
    # agent_1). agent_0 uses CyclingHighLevelPolicy and ignores this solution.
    task_spec: pddl/multi_agent_social_nav_twoagent_human
    measurements:
      social_nav_reward:
        count_coll_pen: 0.01
        max_count_colls: -1
        count_coll_end_pen: 5.0
        safe_dis_min: 0.2
    success_reward: 10.0
    slack_reward: -0.1
    end_on_success: true

  environment:
    max_episode_steps: 300  # Short episodes to cycle through skills

  simulator:
    kinematic_mode: true
    ac_freq_ratio: 4
    ctrl_freq: 120
    agents:
      agent_0:
        joint_start_noise: 0.0

habitat_baselines:
  verbose: true
  trainer_name: "ddppo"
  updater_name: "HRLPPO"
  distrib_updater_name: "HRLDDPPO"
  torch_gpu_id: 0
  video_fps: 30
  num_environments: 1  # Single env for easier debugging
  num_updates: -1
  total_num_steps: 1.0e6
  log_interval: 10
  num_checkpoints: 1
  force_torch_single_threaded: true
  eval_keys_to_include_in_name: ["social_nav_reward"]
  load_resume_state_config: false
  rollout_storage_name: "HrlRolloutStorage"

  eval:
    use_ckpt_config: false
    should_load_ckpt: false
    video_option: ["disk"]

  rl:
    ppo:
      clip_param: 0.2
      ppo_epoch: 2
      num_mini_batch: 4
      value_loss_coef: 0.5
      entropy_coef: 0.001
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.5
      num_steps: 256
      use_gae: true
      gamma: 0.99
      tau: 0.95
      hidden_size: 256

    ddppo:
      sync_frac: 0.6
      distrib_backend: NCCL
      pretrained_weights: "NULL"
      pretrained: false
      pretrained_encoder: false
      train_encoder: true
      reset_critic: false
      backbone: resnet18
      rnn_type: LSTM
      num_recurrent_layers: 2

    agent:
      type: "MultiAgentAccessMgr"
      num_agent_types: 2
      num_active_agents_per_type: [1, 1]
      num_pool_agents_per_type: [1, 1]
      agent_sample_interval: 20
      force_partner_sample_idx: -1

    policy:
      agent_0:
        name: "HierarchicalPolicy"
        hierarchical_policy:
          high_level_policy:
            # FIXED-cycle scaffolding HL: go_to_goal -> wait -> backoff -> ...,
            # each held for its skill's max_skill_steps. The skills run with
            # skill_data.cycle_demo: True so they terminate purely on the step
            # counter (ignore human-distance / goal early-exits). This is only a
            # throwaway demo to verify each low-level skill executes; replace with
            # a learned HL (SocialNavNeuralHighLevelPolicy) for training.
            name: "CyclingHighLevelPolicy"
          defined_skills:
            backoff:
              skill_name: "BackOffSkill"
              pddl_action_names: null
              max_skill_steps: 40          # fixed cycle: ~40 steps per phase
              skill_data:
                cycle_demo: True           # terminate purely on the step counter
                # Reverse-retrace the robot's own path backward (collision-free):
                # keep facing forward, back straight up along the breadcrumb trail.
                human_clear_dist: 1.2
                lookahead: 0.4            # target a breadcrumb ~0.4 m behind
                retreat_speed: 0.5        # m/s reverse speed
                max_back_dist: 0.8        # retreat at most 0.8 m from the entry point
                align_thresh: 0.5         # only reverse if path-behind within ~29 deg; else yield
                lin_speed: 10.0           # = agent_0_base_velocity longitudinal_lin_speed
                arrive_thresh: 0.15
                backoff_debug: False
            wait:
              skill_name: "WaitSkill"
              pddl_action_names: null
              max_skill_steps: 40
              skill_data:
                cycle_demo: True
            go_to_goal:
              skill_name: "GoToGoalSkill"
              pddl_action_names: null
              max_skill_steps: 40
              # Custom RVO/ORCA params live under skill_data (HrlDefinedSkillConfig
              # is a closed schema). rvo_time_step must match ac_freq_ratio/ctrl_freq
              # (4/120 = 0.0333) and rvo_lin_speed must match the agent_0_base_velocity
              # longitudinal_lin_speed (default 10.0).
              skill_data:
                cycle_demo: True           # fixed-cycle demo: terminate on step counter
                rvo_radius: 0.4
                rvo_human_radius: 0.4
                rvo_max_speed: 1.0
                rvo_neighbor_dist: 2.0
                rvo_max_neighbors: 10
                rvo_time_horizon: 2.0
                rvo_time_horizon_obst: 4.0
                # Stop band must be < the success_distance (0.2 m) so the robot
                # actually reaches its goal rather than halting just outside.
                rvo_goal_stop_radius: 0.15
                rvo_time_step: 0.0333
                rvo_lin_speed: 10.0
                turn_thresh: 0.1
                turn_velocity: 1.0
                goal_done_radius: 0.2
                # Hand back to the HL once the human is closer than this so it can
                # switch to backoff (>= high_level_policy.backoff_enter_dist).
                human_switch_dist: 1.0
                # Set True to print a per-step RVO trace for env 0 (robot/human
                # xz, goal_rho, pref, orca_vel, lin, ang) -- useful for tuning.
                rvo_debug: False
          ignore_skills: []

      agent_1:
        name: HierarchicalPolicy
        hierarchical_policy:
          high_level_policy:
            name: "FixedHighLevelPolicy"
            allow_other_place: False
            add_arm_rest: False
            termination_obs_name: "has_finished_oracle_nav"
          defined_skills:
            oracle_nav:
              skill_name: "OracleNavPolicy"
              pddl_action_names: ["nav_to_goal_social"]
              action_name: "agent_1_oracle_nav_action"
              max_skill_steps: 1500
              ignore_grip: true
            wait:
              skill_name: "WaitSkillPolicy"
              pddl_action_names: ["wait"]
              max_skill_steps: -1
              force_end_on_timeout: False
          ignore_skills: ["nav_to_obj", "nav_to_goal", "nav_to_randcoord"]

  checkpoint_folder: "checkpoints_social_nav_skills_rvo"
  tensorboard_dir: "tb_social_nav_skills_rvo"
  video_dir: "video_social_nav_skills_rvo"
