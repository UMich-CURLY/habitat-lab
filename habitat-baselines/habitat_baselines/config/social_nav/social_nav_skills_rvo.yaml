# @package _global_

# HRL social-nav config where agent_0's GoToGoalSkill drives the robot along the
# default navmesh geodesic (no RVO, no human avoidance; outputs base_velocity),
# while the task drives the human (agent_1) with its own RVO. CyclingHighLevelPolicy
# selects go_to_goal by default and switches to backoff when the human gets close.

defaults:
  - /benchmark/multi_agent: hssd_spot_human_social_nav_twoagent
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /habitat/simulator/sim_sensors@habitat_baselines.eval.extra_sim_sensors.third_rgb_sensor: third_rgb_sensor
  - /habitat_baselines/rl/policy/obs_transforms@habitat_baselines.rl.policy.agent_0.obs_transforms.add_virtual_keys:
    - add_virtual_keys_base
  - /habitat_baselines/rl/policy/obs_transforms@habitat_baselines.rl.policy.agent_1.obs_transforms.add_virtual_keys:
    - add_virtual_keys_base
  - _self_

habitat:
  task:
    type: TwoAgentSocialNavTask-v0
    # Human (agent_1) FixedHighLevelPolicy plan that only references skills the
    # human has (the shared *_minimal solution contains back_off, which crashes
    # agent_1). agent_0 uses CyclingHighLevelPolicy and ignores this solution.
    task_spec: pddl/multi_agent_social_nav_twoagent_human
    measurements:
      social_nav_reward:
        count_coll_pen: 0.01
        max_count_colls: -1
        count_coll_end_pen: 5.0
    success_reward: 10.0
    slack_reward: -0.1
    end_on_success: true

  environment:
    max_episode_steps: 300  # Short episodes to cycle through skills

  simulator:
    kinematic_mode: true
    ac_freq_ratio: 4
    ctrl_freq: 120
    agents:
      agent_0:
        joint_start_noise: 0.0

habitat_baselines:
  verbose: true
  trainer_name: "ddppo"
  updater_name: "HRLPPO"
  distrib_updater_name: "HRLDDPPO"
  torch_gpu_id: 0
  video_fps: 30
  num_environments: 1  # Single env for easier debugging
  num_updates: -1
  total_num_steps: 1.0e6
  log_interval: 10
  num_checkpoints: 1
  force_torch_single_threaded: true
  eval_keys_to_include_in_name: ["social_nav_reward"]
  load_resume_state_config: false
  rollout_storage_name: "HrlRolloutStorage"

  eval:
    use_ckpt_config: false
    should_load_ckpt: false
    video_option: ["disk"]

  rl:
    ppo:
      clip_param: 0.2
      ppo_epoch: 2
      num_mini_batch: 4
      value_loss_coef: 0.5
      entropy_coef: 0.001
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.5
      num_steps: 256
      use_gae: true
      gamma: 0.99
      tau: 0.95
      hidden_size: 256

    ddppo:
      sync_frac: 0.6
      distrib_backend: NCCL
      pretrained_weights: "NULL"
      pretrained: false
      pretrained_encoder: false
      train_encoder: true
      reset_critic: false
      backbone: resnet18
      rnn_type: LSTM
      num_recurrent_layers: 2

    agent:
      type: "MultiAgentAccessMgr"
      num_agent_types: 2
      num_active_agents_per_type: [1, 1]
      num_pool_agents_per_type: [1, 1]
      agent_sample_interval: 20
      force_partner_sample_idx: -1

    policy:
      agent_0:
        name: "HierarchicalPolicy"
        hierarchical_policy:
          high_level_policy:
            name: "CyclingHighLevelPolicy"
            # Rule-based switch policy: backoff when the human gets within
            # backoff_enter_dist, resume go_to_goal once farther than
            # backoff_exit_dist. Earlier trigger (1.5 m) so the robot starts
            # yielding sooner; exit > enter keeps a hysteresis band.
            backoff_enter_dist: 1.5
            backoff_exit_dist: 1.7
          defined_skills:
            backoff:
              skill_name: "BackOffSkill"
              pddl_action_names: null
              max_skill_steps: 60          # safety cap; target-reached usually fires first
              skill_data:
                # Back up to a point ~2 m behind the door on the start side via
                # default pathfinding (target/waypoint come from the
                # backoff_waypoint_delta sensor); drive in reverse the whole way.
                max_back_speed: 1.0        # m/s reverse speed (ramps down near target)
                lin_speed: 10.0            # = agent_0_base_velocity longitudinal_lin_speed
                turn_thresh: 0.1           # rad; align back-to-waypoint before reversing
                turn_velocity: 1.0
                start_stop_radius: 0.15    # stop forcing motion within this of target
                start_done_radius: 0.3     # reached target -> hand back to HL
                backoff_debug: False
            wait:
              skill_name: "WaitSkill"
              pddl_action_names: null
              max_skill_steps: 100
            go_to_goal:
              skill_name: "GoToGoalSkill"
              pddl_action_names: null
              max_skill_steps: 100
              skill_data:
                # Geodesic path following (goal_waypoint_delta sensor); lin_speed
                # must match the agent_0_base_velocity longitudinal_lin_speed.
                max_speed: 1.0             # m/s forward speed (ramps down near goal)
                lin_speed: 10.0
                turn_thresh: 0.1
                turn_velocity: 1.0
                goal_stop_radius: 0.15     # < success_distance (0.4) so success fires
                goal_done_radius: 0.3      # reached goal -> hand back to HL
                goal_debug: False
          ignore_skills: []

      agent_1:
        name: HierarchicalPolicy
        hierarchical_policy:
          high_level_policy:
            name: "FixedHighLevelPolicy"
            allow_other_place: False
            add_arm_rest: False
            termination_obs_name: "has_finished_oracle_nav"
          defined_skills:
            oracle_nav:
              skill_name: "OracleNavPolicy"
              pddl_action_names: ["nav_to_goal_social"]
              action_name: "agent_1_oracle_nav_action"
              max_skill_steps: 1500
              ignore_grip: true
            wait:
              skill_name: "WaitSkillPolicy"
              pddl_action_names: ["wait"]
              max_skill_steps: -1
              force_end_on_timeout: False
          ignore_skills: ["nav_to_obj", "nav_to_goal", "nav_to_randcoord"]

  checkpoint_folder: "checkpoints_social_nav_skills_rvo"
  tensorboard_dir: "tb_social_nav_skills_rvo"
  video_dir: "video_social_nav_skills_rvo"
